<!DOCTYPE html>
<html lang="id">
<head>
    <link
    rel="manifest"
    href="manifest.json"
>

    <meta
    name="theme-color"
    content="#0f172a"
>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ujian Kiosk</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<div class="app">

    <!-- =========================
         HALAMAN BERANDA
         ========================= -->

    <section id="homePage" class="page active">

        <div class="logo">
            📝
        </div>

        <h1>UJIAN KIOSK</h1>

        <h2 id="schoolName">
            Memuat...
        </h2>

        <p id="examTitle">
            Memuat informasi ujian...
        </p>

        <div class="card">

            <label for="studentName">
                Nama Lengkap
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Masukkan nama lengkap"
                autocomplete="off"
            >

            <label for="studentClass">
                Kelas
            </label>

            <input
                type="text"
                id="studentClass"
                placeholder="Contoh: XII IPA 1"
                autocomplete="off"
            >

            <button
                id="startButton"
                class="btn-primary"
            >
                MULAI UJIAN
            </button>

        </div>

        <div
            id="status"
            class="status"
        >
            Menghubungkan ke server...
        </div>

    </section>


    <!-- =========================
         HALAMAN SCAN QR
         ========================= -->

    <section id="scanPage" class="page">

    <div class="header">

        <button
            id="backButton"
            class="btn-back"
        >
            ←
        </button>

        <h2>
            Scan QR Code Soal
        </h2>

    </div>

    <div class="card scan-card">

        <h3>
            📷 Arahkan Kamera ke QR Code
        </h3>

        <p class="muted">
            Scan QR Code yang berisi link Google Form ujian.
        </p>

        <!-- Tempat kamera -->
        <div id="qr-reader"></div>

        <div
            id="qr-status"
            class="status"
        >
            Menyiapkan kamera...
        </div>

        <div class="divider">
            ATAU
        </div>

        <button
            id="manualFormButton"
            class="btn-secondary"
        >
            Masukkan Link Google Form
        </button>

    </div>

</section>


    <!-- =========================
         HALAMAN UJIAN
         ========================= -->

    <section id="examPage" class="page exam-page">

    <div class="exam-header">

        <div class="exam-info">
            <strong id="examHeaderTitle">
                UJIAN
            </strong>

            <small id="studentInfo">
                -
            </small>
        </div>

        <button
            id="exitButton"
            class="btn-exit"
        >
            🔒 Keluar
        </button>

    </div>

    <div
        id="formContainer"
        class="form-container"
    >
    </div>

</section>

    <!-- =========================
         MODAL PASSWORD
         ========================= -->

    <div
        id="passwordModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <h2>
                🔒 Password Pengawas
            </h2>

            <p>
                Masukkan password untuk keluar dari aplikasi.
            </p>

            <input
                type="password"
                id="passwordInput"
                placeholder="Password"
                autocomplete="off"
            >

            <div
                id="passwordMessage"
                class="error"
            ></div>

            <div class="modal-buttons">

                <button
                    id="cancelPassword"
                    class="btn-secondary"
                >
                    BATAL
                </button>

                <button
                    id="verifyPassword"
                    class="btn-primary"
                >
                    VERIFIKASI
                </button>

            </div>

        </div>

    </div>

</div>

<script
    src="https://unpkg.com/html5-qrcode"
></script>
<script src="js/api.js"></script>

<script src="js/app.js"></script>

    <script>
if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "./sw.js"
            );

        }
    );

}
</script>

</body>
</html>
